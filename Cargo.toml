[workspace]
resolver = "2"
members = [
    "crates/mimus-cli",
    "crates/mimus-core",
    "crates/mimus-claims",
    "crates/mimus-check",
    "crates/mimus-check-fs",
    "crates/mimus-check-cmd",
    "crates/mimus-check-symbol",
    "crates/mimus-check-graph",
    "crates/mimus-check-acp",
    "crates/mimus-rules",
    "crates/mimus-vcs",
    "crates/mimus-git",
    "crates/mimus-secret",
    "crates/mimus-keyring",
    "crates/mimus-dotenv",
    "crates/mimus-config",
    "crates/mimus-config-toml",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/mimus"
description = "Spots the cuckoo eggs in your repo — claim extraction + verification: docs-as-tests, memory audit"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
mimus-core = { path = "crates/mimus-core", version = "0.1.0" }
mimus-claims = { path = "crates/mimus-claims", version = "0.1.0" }
mimus-check = { path = "crates/mimus-check", version = "0.1.0" }
mimus-check-fs = { path = "crates/mimus-check-fs", version = "0.1.0" }
mimus-check-cmd = { path = "crates/mimus-check-cmd", version = "0.1.0" }
mimus-check-symbol = { path = "crates/mimus-check-symbol", version = "0.1.0" }
mimus-check-graph = { path = "crates/mimus-check-graph", version = "0.1.0" }
mimus-check-acp = { path = "crates/mimus-check-acp", version = "0.1.0" }
mimus-rules = { path = "crates/mimus-rules", version = "0.1.0" }
mimus-vcs = { path = "crates/mimus-vcs", version = "0.1.0" }
mimus-git = { path = "crates/mimus-git", version = "0.1.0" }
mimus-secret = { path = "crates/mimus-secret", version = "0.1.0" }
mimus-keyring = { path = "crates/mimus-keyring", version = "0.1.0" }
mimus-dotenv = { path = "crates/mimus-dotenv", version = "0.1.0" }
mimus-config = { path = "crates/mimus-config", version = "0.1.0" }
mimus-config-toml = { path = "crates/mimus-config-toml", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
regex = "1"
glob = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_yaml = "0.9"
