[workspace]
resolver = "2"
members = [
    "crates/malurus-cli",
    "crates/malurus-core",
    "crates/malurus-claims",
    "crates/malurus-check",
    "crates/malurus-check-fs",
    "crates/malurus-check-cmd",
    "crates/malurus-check-symbol",
    "crates/malurus-rules",
    "crates/malurus-vcs",
    "crates/malurus-git",
    "crates/malurus-secret",
    "crates/malurus-keyring",
    "crates/malurus-dotenv",
    "crates/malurus-config",
    "crates/malurus-config-toml",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/malurus"
description = "Spots the cuckoo eggs in your repo — claim extraction + verification: docs-as-tests, memory audit"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
malurus-core = { path = "crates/malurus-core", version = "0.1.0" }
malurus-claims = { path = "crates/malurus-claims", version = "0.1.0" }
malurus-check = { path = "crates/malurus-check", version = "0.1.0" }
malurus-check-fs = { path = "crates/malurus-check-fs", version = "0.1.0" }
malurus-check-cmd = { path = "crates/malurus-check-cmd", version = "0.1.0" }
malurus-check-symbol = { path = "crates/malurus-check-symbol", version = "0.1.0" }
malurus-rules = { path = "crates/malurus-rules", version = "0.1.0" }
malurus-vcs = { path = "crates/malurus-vcs", version = "0.1.0" }
malurus-git = { path = "crates/malurus-git", version = "0.1.0" }
malurus-secret = { path = "crates/malurus-secret", version = "0.1.0" }
malurus-keyring = { path = "crates/malurus-keyring", version = "0.1.0" }
malurus-dotenv = { path = "crates/malurus-dotenv", version = "0.1.0" }
malurus-config = { path = "crates/malurus-config", version = "0.1.0" }
malurus-config-toml = { path = "crates/malurus-config-toml", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
regex = "1"
glob = "0.3"
