[workspace]
resolver = "2"
members = [
    "crates/mimus-cli",
    "crates/mimus-core",
    "crates/mimus-claims",
    "crates/mimus-check",
    "crates/mimus-check-fs",
    "crates/mimus-check-cmd",
    "crates/mimus-check-symbol",
    "crates/mimus-check-graph",
    "crates/mimus-check-acp",
    "crates/mimus-rules",
    "crates/mimus-config",
    "crates/mimus-spec",
    "crates/mimus-driver",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/mimus"
description = "Verification engine — proofs over what agents claim"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
mimus = { path = "crates/mimus-cli", version = "1.0.0" }
mimus-core = { path = "crates/mimus-core", version = "1.0.0" }
mimus-claims = { path = "crates/mimus-claims", version = "1.0.0" }
mimus-check = { path = "crates/mimus-check", version = "1.0.0" }
mimus-check-fs = { path = "crates/mimus-check-fs", version = "1.0.0" }
mimus-check-cmd = { path = "crates/mimus-check-cmd", version = "1.0.0" }
mimus-check-symbol = { path = "crates/mimus-check-symbol", version = "1.0.0" }
mimus-check-graph = { path = "crates/mimus-check-graph", version = "1.0.0" }
mimus-check-acp = { path = "crates/mimus-check-acp", version = "1.0.0" }
mimus-rules = { path = "crates/mimus-rules", version = "1.0.0" }
cuora-secret = { git = "ssh://git@github.com/9aia/cuora.git", rev = "c3a1e0a9601ec4dd8a3dbbe64c973a4d03418372" }
cuora-secret-cuora = { git = "ssh://git@github.com/9aia/cuora.git", rev = "c3a1e0a9601ec4dd8a3dbbe64c973a4d03418372" }
cuora-secret-keyring = { git = "ssh://git@github.com/9aia/cuora.git", rev = "c3a1e0a9601ec4dd8a3dbbe64c973a4d03418372" }
cuora-secret-dotenv = { git = "ssh://git@github.com/9aia/cuora.git", rev = "c3a1e0a9601ec4dd8a3dbbe64c973a4d03418372" }
mimus-config = { path = "crates/mimus-config", version = "1.0.0" }
mimus-spec = { path = "crates/mimus-spec", version = "1.0.0" }
mimus-driver = { path = "crates/mimus-driver", version = "1.0.0" }
# P-053 item 1 — kuda index read surface (read-only SqliteStore).
kuda-core = { git = "ssh://git@github.com/9aia/kuda.git", rev = "44953ecc4af348be96c63142715a97bc52139bed", version = "0.3" }
kuda-store = { git = "ssh://git@github.com/9aia/kuda.git", rev = "44953ecc4af348be96c63142715a97bc52139bed", version = "0.3" }
kuda-store-sqlite = { git = "ssh://git@github.com/9aia/kuda.git", rev = "44953ecc4af348be96c63142715a97bc52139bed", version = "0.3" }
scarab-config = { git = "ssh://git@github.com/9aia/scarab.git", rev = "20dabb1ad957b22bc8f3432feeadee09aa69371a", version = "0.2.0" }
scarab-config-file = { git = "ssh://git@github.com/9aia/scarab.git", rev = "20dabb1ad957b22bc8f3432feeadee09aa69371a", version = "0.2.0" }
# standard tier (P-001): spec documents resolve extends:/include:
# through scarab-compose — newer rev than the config crates above.
# default-features off: the `tamias` feature pulls the tamias
# store/install crates; `tamias:` spec refs error loudly without
# it (spike scope — no tamias: resolution yet).
scarab-compose = { git = "ssh://git@github.com/9aia/scarab.git", rev = "20dabb1ad957b22bc8f3432feeadee09aa69371a", version = "0.2.0", default-features = false }
scarab-validate = { git = "ssh://git@github.com/9aia/scarab.git", rev = "20dabb1ad957b22bc8f3432feeadee09aa69371a", version = "0.1" }
globset = "0.4"
thiserror = "2"
tempfile = "3"
sepia-acp = { git = "ssh://git@github.com/9aia/sepia.git", rev = "9e006d22e6fa442197082a2277ca40a01b43e7e3", version = "1.0.0" }
lasius-vcs = { git = "ssh://git@github.com/9aia/lasius.git", rev = "89e51894b9cd118141fe66d1c8c1d114c60d4ea5", version = "0.5.0" }
lasius-vcs-git = { git = "ssh://git@github.com/9aia/lasius.git", rev = "89e51894b9cd118141fe66d1c8c1d114c60d4ea5", version = "0.5.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
regex = "1"
glob = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_yaml = "0.9"
