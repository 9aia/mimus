[workspace]
resolver = "2"
members = [
    "crates/mimus-cli",
    "crates/mimus-core",
    "crates/mimus-claims",
    "crates/mimus-check",
    "crates/mimus-check-fs",
    "crates/mimus-check-cmd",
    "crates/mimus-check-symbol",
    "crates/mimus-check-graph",
    "crates/mimus-check-acp",
    "crates/mimus-rules",
    "crates/mimus-config",
    "crates/mimus-spec",
    "crates/mimus-driver",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/mimus"
description = "Verification engine — proofs over what agents claim"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
mimus = { path = "crates/mimus-cli", version = "0.1.0" }
mimus-core = { path = "crates/mimus-core", version = "0.1.0" }
mimus-claims = { path = "crates/mimus-claims", version = "0.1.0" }
mimus-check = { path = "crates/mimus-check", version = "0.1.0" }
mimus-check-fs = { path = "crates/mimus-check-fs", version = "0.1.0" }
mimus-check-cmd = { path = "crates/mimus-check-cmd", version = "0.1.0" }
mimus-check-symbol = { path = "crates/mimus-check-symbol", version = "0.1.0" }
mimus-check-graph = { path = "crates/mimus-check-graph", version = "0.1.0" }
mimus-check-acp = { path = "crates/mimus-check-acp", version = "0.1.0" }
mimus-rules = { path = "crates/mimus-rules", version = "0.1.0" }
cuora-secret = { git = "ssh://git@github.com/9aia/cuora.git", rev = "f81164366bd436a7d4cf204c6e7a83555f50302f" }
cuora-secret-cuora = { git = "ssh://git@github.com/9aia/cuora.git", rev = "f81164366bd436a7d4cf204c6e7a83555f50302f" }
cuora-secret-keyring = { git = "ssh://git@github.com/9aia/cuora.git", rev = "f81164366bd436a7d4cf204c6e7a83555f50302f" }
cuora-secret-dotenv = { git = "ssh://git@github.com/9aia/cuora.git", rev = "f81164366bd436a7d4cf204c6e7a83555f50302f" }
mimus-config = { path = "crates/mimus-config", version = "0.1.0" }
mimus-spec = { path = "crates/mimus-spec", version = "0.1.0" }
mimus-driver = { path = "crates/mimus-driver", version = "0.1.0" }
scarab-config = { git = "ssh://git@github.com/9aia/scarab.git", rev = "9364df88fad0ca46bd838467717a823893f47438", version = "0.1" }
scarab-config-file = { git = "ssh://git@github.com/9aia/scarab.git", rev = "9364df88fad0ca46bd838467717a823893f47438", version = "0.1" }
# standard tier (P-001): spec documents resolve extends:/include:
# through scarab-compose — newer rev than the config crates above.
# default-features off: the `tamias` feature pulls the tamias
# store/install crates; `tamias:` spec refs error loudly without
# it (spike scope — no tamias: resolution yet).
scarab-compose = { git = "ssh://git@github.com/9aia/scarab.git", rev = "85e50d57110b2f785a5c11d8cf55de7737d67257", version = "0.1", default-features = false }
scarab-validate = { git = "ssh://git@github.com/9aia/scarab.git", rev = "85e50d57110b2f785a5c11d8cf55de7737d67257", version = "0.1" }
globset = "0.4"
thiserror = "2"
tempfile = "3"
sepia-acp = { git = "ssh://git@github.com/9aia/sepia.git", rev = "c6f66e48050a76e24f4149438d6c20ab21bbbd91", version = "0.2.0" }
lasius-vcs = { git = "ssh://git@github.com/9aia/lasius.git", rev = "351857536395951d5f6f8502cdaf86a737520b02", version = "0.4" }
lasius-vcs-git = { git = "ssh://git@github.com/9aia/lasius.git", rev = "351857536395951d5f6f8502cdaf86a737520b02", version = "0.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
regex = "1"
glob = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_yaml = "0.9"
