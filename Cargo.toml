[workspace]
resolver = "2"
members = [
    "crates/malurus-cli",
    "crates/malurus-systemd",
    "crates/malurus-core",
    "crates/malurus-trigger",
    "crates/malurus-vcs",
    "crates/malurus-git",
    "crates/malurus-queue",
    "crates/malurus-queue-redb",
    "crates/malurus-service",
    "crates/malurus-secret",
    "crates/malurus-keyring",
    "crates/malurus-dotenv",
    "crates/malurus-config",
    "crates/malurus-config-toml",
    "crates/malurus-cache",
    "crates/malurus-cache-sccache",
    "crates/malurus-ssh",
    "crates/malurus-status",
    "crates/malurus-github",
    "crates/malurus-runner",
    "crates/malurus-dagger",
    "crates/malurus-shell",
    "crates/malurus-tunnel",
    "crates/malurus-cloudflared",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/9aia/malurus"
description = "Spots the cuckoo eggs in your repo — claim extraction + verification: docs-as-tests, memory audit"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
malurus-core = { path = "crates/malurus-core", version = "0.1.0" }
malurus-trigger = { path = "crates/malurus-trigger", version = "0.1.0" }
malurus-vcs = { path = "crates/malurus-vcs", version = "0.1.0" }
malurus-git = { path = "crates/malurus-git", version = "0.1.0" }
malurus-queue = { path = "crates/malurus-queue", version = "0.1.0" }
malurus-queue-redb = { path = "crates/malurus-queue-redb", version = "0.1.0" }
malurus-service = { path = "crates/malurus-service", version = "0.1.0" }
malurus-secret = { path = "crates/malurus-secret", version = "0.1.0" }
malurus-keyring = { path = "crates/malurus-keyring", version = "0.1.0" }
malurus-dotenv = { path = "crates/malurus-dotenv", version = "0.1.0" }
malurus-config = { path = "crates/malurus-config", version = "0.1.0" }
malurus-config-toml = { path = "crates/malurus-config-toml", version = "0.1.0" }
malurus-cache = { path = "crates/malurus-cache", version = "0.1.0" }
malurus-cache-sccache = { path = "crates/malurus-cache-sccache", version = "0.1.0" }
malurus-ssh = { path = "crates/malurus-ssh", version = "0.1.0" }
serde_json = "1"
malurus-status = { path = "crates/malurus-status", version = "0.1.0" }
malurus-runner = { path = "crates/malurus-runner", version = "0.1.0" }
malurus-tunnel = { path = "crates/malurus-tunnel", version = "0.1.0" }
malurus-dagger = { path = "crates/malurus-dagger", version = "0.1.0" }
malurus-shell = { path = "crates/malurus-shell", version = "0.1.0" }
malurus-github = { path = "crates/malurus-github", version = "0.1.0" }
malurus-cloudflared = { path = "crates/malurus-cloudflared", version = "0.1.0" }
malurus-systemd = { path = "crates/malurus-systemd", version = "0.1.0" }
