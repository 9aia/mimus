[package]
name = "mimus-driver"
description = "tamias-driver-mimus — pavo view driver over a repo's mimus critic state (violations, rules, card audit)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["verification", "mimus"]
categories = ["development-tools"]

[[bin]]
name = "tamias-driver-mimus"
path = "src/main.rs"

[dependencies]
mimus-core.workspace = true
mimus-config.workspace = true
mimus-config-toml.workspace = true
mimus-rules.workspace = true
mimus-check-graph.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
# pavo driver-authoring kit — ndjson serve loop + manifest/ViewNode
# builders over pavo-protocol types. Git deps, not path: a fresh
# mimus clone has no sibling ../pavo checkout and CI must still
# resolve (same convention as myco/kuda/cuora/sturn drivers).
pavo-driver-kit = { git = "https://github.com/9aia/pavo", version = "0.1.0" }
pavo-protocol = { git = "https://github.com/9aia/pavo", version = "0.1.0" }

[dev-dependencies]
# Conformance gate — `cargo test` runs pavo's wire-contract suite
# against this crate's own `tamias-driver-mimus serve` binary.
pavo-testkit = { git = "https://github.com/9aia/pavo" }
